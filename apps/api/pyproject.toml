[project]
name = "factory-api"
version = "0.1.0"
description = "Product Factory backend (FastAPI)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "SIM", "RUF", "ASYNC", "T20", "PL"]
ignore = ["PLR2004", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913"]
"migrations/**" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.13"
exclude = ["migrations/", ".venv/"]

[[tool.mypy.overrides]]
module = ["slowapi", "slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --cov=app --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
branch = true
# SQLAlchemy's async layer runs inside greenlets and the test client in threads; trace both.
concurrency = ["greenlet", "thread"]
